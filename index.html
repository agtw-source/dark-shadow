<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Dark Shadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0612; --ui:#b07cff; --ui2:#ffd23f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; font-family:'Press Start 2P',monospace; color:#e9dcff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#000; display:block;
    box-shadow:0 0 40px rgba(140,60,255,.25); }
  #touch { position:fixed; inset:0; pointer-events:none; display:none; }
  body.touch #touch { display:block; }
  #stick { position:absolute; left:calc(18px + env(safe-area-inset-left)); bottom:calc(18px + env(safe-area-inset-bottom));
    width:150px; height:150px; border-radius:50%; background:rgba(176,124,255,.12); border:2px solid rgba(176,124,255,.35);
    pointer-events:auto; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:62px; height:62px; margin:-31px 0 0 -31px; border-radius:50%;
    background:rgba(176,124,255,.45); border:2px solid rgba(255,255,255,.4); }
  #btns { position:absolute; right:calc(14px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom));
    width:230px; height:180px; pointer-events:none; }
  .b { position:absolute; width:62px; height:62px; border-radius:50%; pointer-events:auto; touch-action:none;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; text-align:center; line-height:1.3;
    background:rgba(120,50,200,.45); border:2px solid rgba(255,255,255,.35); text-shadow:1px 1px 0 #000; }
  .b.on { background:rgba(200,120,255,.8); }
  .b.small { width:50px; height:50px; font-size:7px; }
  #bA { right:0; bottom:40px; background:rgba(200,40,80,.5); }
  #bB { right:70px; bottom:0; }
  #bC { right:70px; bottom:70px; }
  #bD { right:140px; bottom:40px; }
  #bS { right:6px; bottom:118px; background:rgba(255,200,40,.45); }
  #bG { right:150px; bottom:112px; }
  #bP { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); width:44px; height:30px; border-radius:6px; font-size:8px; }
  #bM { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(58px + env(safe-area-inset-right)); width:44px; height:30px; border-radius:6px; font-size:8px; }
  #rotate { display:none; position:fixed; inset:0; background:var(--bg); z-index:5; align-items:center; justify-content:center;
    text-align:center; font-size:12px; line-height:2; padding:24px; color:var(--ui); }
  @media (orientation:portrait) and (max-width:800px) { body.touch #rotate { display:flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360" aria-label="Dark Shadow, gioco picchiaduro"></canvas></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <div class="b" id="bA" data-k="attack">COLPO</div>
    <div class="b" id="bB" data-k="jump">SALTO</div>
    <div class="b small" id="bC" data-k="arc">ARCO</div>
    <div class="b small" id="bD" data-k="orb">SFERA</div>
    <div class="b small" id="bS" data-k="super">SUPER</div>
    <div class="b small" id="bG" data-k="guard">PARATA</div>
  </div>
  <div class="b" id="bP" data-k="pause">II</div>
  <div class="b" id="bM" data-k="mute">♪</div>
</div>
<div id="rotate">Ruota il telefono<br>in orizzontale ↻</div>
<script src="js/game.js"></script>
</body>
</html>
